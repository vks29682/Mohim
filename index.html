<style>
/* Layout: dark-green dusk page. Header + scrollable tab bar, then one page at a time; hero slider only on Home. */
:root{
  --bg:#0c1812; --surface:#13251b; --surface-2:#1a3125; --line:#2b4838;
  --fg:#e9f0ea; --muted:#9bb2a3; --accent:#f08a24; --accent-fg:#1c1204;
  --ok:#52c27f; --warn:#e5b347; --bad:#e2574c; --hard:#e8803b;
  --font-body:'Mukta','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Yatra One','Mukta','Noto Sans Devanagari',serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:22px} h3{font-size:17px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)} .small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--font-display);font-weight:400;font-size:20px;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12px}
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--surface-2)}
.pill.admin{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px;scrollbar-width:thin}
nav.tabs a{flex:none;padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent}
nav.tabs a:hover{color:var(--fg)}
nav.tabs a.on{color:var(--fg);border-bottom-color:var(--accent)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;min-height:38px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{border-color:var(--bad);color:#ffb3ad}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>h3{margin-bottom:12px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pagehead{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stack{display:flex;flex-direction:column;gap:16px}

/* hero */
.hero{position:relative;height:250px;border-radius:12px;overflow:hidden;border:1px solid var(--line);margin-bottom:16px;background:#14231b}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1}
.slide svg{width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,18,13,.78) 0%,rgba(8,18,13,.35) 55%,rgba(8,18,13,0) 100%);pointer-events:none}
.hero-copy{position:absolute;left:20px;top:20px;right:20px;z-index:2;max-width:520px}
.hero-copy h1{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:4px 0 8px}
.hero-verse{font-size:clamp(14px,2.6vw,18px);line-height:1.5;color:#ffe9cc;font-weight:500;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#ffd9a8;font-weight:600}
.hero-cap{position:absolute;right:16px;bottom:12px;z-index:2;font-size:13px;background:rgba(8,18,13,.7);padding:3px 10px;border-radius:99px;border:1px solid var(--line)}
.dots{position:absolute;left:20px;bottom:14px;z-index:2;display:flex;gap:6px}
.dots button{width:10px;height:10px;border-radius:50%;border:1px solid #ffd9a8;background:transparent;padding:0;cursor:pointer}
.dots button.on{background:#ffd9a8}

/* KPI */
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .lab{color:var(--muted);font-size:13px;font-weight:600}
.kpi .val{font-family:var(--font-display);font-size:36px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.k1 .val{color:#ffd9a8} .kpi.k3 .val{color:var(--ok)} .kpi.k4 .val{color:var(--bad)}
.kpi .sub{font-size:12px;color:var(--muted)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;letter-spacing:.04em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.warn i{background:var(--warn)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid}
.d-सोपे{color:var(--ok);border-color:var(--ok)} .d-मध्यम{color:var(--warn);border-color:var(--warn)}
.d-कठीण{color:var(--hard);border-color:var(--hard)} .d-अतिकठीण{color:var(--bad);border-color:var(--bad)}

/* forms */
.form{display:flex;flex-direction:column;gap:12px}
.form label,.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:38px;width:100%;color:var(--fg)}
textarea{min-height:110px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}

/* avatars, rings */
.av{width:38px;height:38px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#0c1812;object-fit:cover}
.av.lg{width:64px;height:64px;font-size:24px}
.who-cell{display:flex;align-items:center;gap:10px}
.ring text{fill:var(--fg);font-family:var(--font-body);font-weight:700}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.rcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-align:center}
.mcard{display:flex;flex-direction:column;gap:10px}
.mcard .meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* activity */
.act{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.act li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.act li:last-child{border-bottom:0}

/* visit entry */
.vrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;position:relative}
.vrow:hover{border-color:var(--muted)}
.vrow input{position:absolute;opacity:0;width:100%;height:100%;left:0;top:0;margin:0;cursor:pointer}
.vrow .box{width:26px;height:26px;border-radius:6px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-weight:700}
.vrow input:checked~.box{background:var(--ok);border-color:var(--ok);color:#06210f}
.vrow input:focus-visible~.box{outline:2px solid var(--accent);outline-offset:2px}
.vrow.is-done{background:var(--surface-2)}
.vrow .t{flex:1;min-width:0}
.vrow .t b{display:block}
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}

/* map */
.mapbox{overflow-x:auto;padding-bottom:6px}
.tmap{display:grid;grid-template-columns:repeat(10,minmax(58px,1fr));gap:6px;min-width:640px}
.tile{aspect-ratio:1;border-radius:8px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2px;font-size:11px;line-height:1.15;cursor:pointer;color:#06140c;font-weight:600;overflow:hidden}
.tile .c{font-size:12px;font-weight:700}
.tile.t-ok{background:var(--ok)} .tile.t-part{background:var(--warn)} .tile.t-no{background:var(--bad);color:#2a0a07} .tile.t-none{background:var(--surface-2);color:var(--muted);border-color:var(--line);cursor:default;font-weight:400}
.tile.sel{outline:3px solid var(--fg);outline-offset:1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.fl{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.fl li{display:flex;gap:8px;align-items:center}
.chk{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}
.chk.y{background:var(--ok);color:#06210f} .chk.n{background:transparent;border:2px solid var(--bad);color:var(--bad)}

/* charts */
.chartbox{position:relative;height:300px}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(4,10,7,.72);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:30}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:480px;margin-block:auto;display:flex;flex-direction:column;gap:14px}
.sheet.wide{max-width:640px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ok);color:#06210f;padding:8px 16px;border-radius:99px;font-weight:700;z-index:40;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.toast.err{background:var(--bad);color:#fff}
.note{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted)}
footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center}
.credit{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}.credit b{color:var(--fg)}
/* trip poll */
.pcard{position:absolute;right:16px;top:16px;z-index:3;width:min(300px,45%);background:rgba(8,18,13,.84);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.pcard .pf{font-family:var(--font-display);font-size:20px;font-weight:400;line-height:1.2}
.pcard .btn{margin-top:6px}
.plist{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.prow.fin{border-color:var(--ok)}
.prow .t{flex:1;min-width:160px}
.prow .pv{display:flex;flex-direction:column;align-items:center;min-width:44px}
.prow .pa{display:flex;gap:6px;flex-wrap:wrap}
@media (min-width:721px){.hero-copy{max-width:min(520px,calc(100% - 350px))}}
@media (max-width:720px){.hero{height:350px}.pcard{left:12px;right:12px;top:auto;bottom:12px;width:auto}.hero-cap,.dots{display:none}.hero-copy{max-width:none}}
/* read-only visit rows */
.vrow.ro,.vrow.ro input{cursor:default}.vrow.ro:hover{border-color:var(--line)}.vrow.ro:not(.is-done){opacity:.7}
@media (prefers-reduced-motion:reduce){.slide{transition:none}}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gi{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);cursor:pointer;text-align:left;color:inherit;display:flex;flex-direction:column}
.gi img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.gi span{padding:6px 8px;display:flex;flex-direction:column}.gi small{color:var(--muted)}
.tprev{display:flex;gap:6px;flex-wrap:wrap}.tprev img{width:64px;height:64px;object-fit:cover;border-radius:6px}
.big{width:100%;max-height:70vh;object-fit:contain;border-radius:8px;background:#000}
[hidden]{display:none!important}
.panel{background:rgba(19,37,27,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.av.sm{width:24px;height:24px;font-size:12px}
/* trip tracker */
.trk{display:grid;grid-template-columns:repeat(4,1fr)}
.stp{display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;padding:0 4px;font-size:12px;gap:6px}
.stp .dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);display:flex;align-items:center;justify-content:center;z-index:1;font-size:16px}
.stp::before{content:"";position:absolute;top:16px;left:-50%;width:100%;height:3px;background:var(--line)}
.stp:first-child::before{display:none}
.stp.done::before,.stp.cur::before{background:var(--ok)}
.stp.done .dot{background:var(--ok);border-color:var(--ok);color:#06210f;font-weight:700}
.stp.cur .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 5px rgba(240,138,36,.25)}
@media (max-width:560px){.trk{grid-template-columns:1fr;gap:12px}.stp{flex-direction:row;text-align:left;gap:12px}.stp::before{display:none}}
/* pending-payment hero slide */
.pendbox{display:none;position:absolute;left:20px;top:16px;z-index:2;max-width:min(520px,calc(100% - 40px));max-height:calc(100% - 32px);overflow:auto;flex-direction:column;gap:6px}
.hero.pendmode .pendbox{display:flex}
.hero.pendmode .hero-copy,.hero.pendmode .pcard{display:none}
.pendbox ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.pendbox li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:rgba(8,18,13,.72);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.pendbox li span{color:#ffb3ad;font-weight:700}
.pendbox li small{color:var(--muted)}

.avw{position:relative;display:inline-flex}
.odot{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.avw .av.sm~.odot{width:9px;height:9px}
.avb{background:none;border:0;padding:0;cursor:zoom-in;display:inline-flex}
.av.lg.big-av{width:160px;height:160px;font-size:64px}
.tile{overflow-wrap:anywhere}
.pendpop{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 24px));max-height:70vh;overflow:auto;z-index:60;background:var(--surface);border:1px solid var(--bad);border-radius:12px;padding:12px 14px;box-shadow:0 10px 36px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:8px;animation:ppIn .3s ease-out}
.pendpop .pp-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pendpop .pp-me{background:rgba(255,120,110,.14);border:1px solid var(--bad);border-radius:8px;padding:6px 10px}
.pendpop ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.pendpop li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.pendpop li span{color:#ffb3ad;font-weight:700}.pendpop li small{color:var(--muted)}
@keyframes ppIn{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){.pendpop{animation:none}}
/* ===== extra: gallery actions, comments, site like, cost estimator ===== */
.slike{white-space:nowrap}
.gi.gcard{cursor:default}
.gimg{padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%;color:inherit}
.gcap{padding:6px 8px 2px;display:flex;flex-direction:column}
.gact{display:flex;gap:6px;flex-wrap:wrap;padding:4px 8px 8px}
.gb{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:99px;padding:2px 10px;min-height:30px;font-size:13px;font-weight:600;cursor:pointer}
.gb:hover{border-color:var(--muted)}
.gb.on{border-color:var(--bad);background:rgba(226,87,76,.16)}
.gb.danger{border-color:var(--bad);color:#ffb3ad}
.cmbox{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.cmlist{display:flex;flex-direction:column;gap:8px;max-height:240px;overflow:auto}
.cm{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.cm p{margin-top:2px;overflow-wrap:anywhere}
.form textarea.cmt{min-height:64px;font-family:var(--font-body);font-size:14px}
.cost-sec{margin:14px 0 8px;font-size:15px;color:#ffd9a8}
details.rates{border:1px dashed var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px}
details.rates summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.rates .filters{margin-top:10px}
tr.best td{background:rgba(82,194,127,.12)}
.kpi .val.sm{font-size:26px}
.shurl{display:flex;gap:8px}
</style>

  var visits={};
  members.forEach(function(m,i){
    var order=forts.map(function(f,j){return{f:f,s:rnd()+j/(forts.length*1.4)};}).sort(function(a,b){return a.s-b.s;}).slice(0,names[i][1]);

function migS(o){
  if(!o||!o.forts||o.fortsV>=2)return false;
  var mp={},byN={};
  FORTS.forEach(function(f){byN[f[1]]=f[0];});
  o.forts.forEach(function(f){var c=OLD2NEW[f.code]||byN[f.name];if(c)mp[f.code]=c;});
  var nv={};
  Object.keys(o.visits||{}).forEach(function(m){var v=o.visits[m]||{},r={};Object.keys(v).forEach(function(c){if(mp[c])r[mp[c]]=v[c];});nv[m]=r;});
  o.visits=nv;
  o.polls=(o.polls||[]).filter(function(p){if(!mp[p.fort])return false;p.fort=mp[p.fort];return true;});
  if(o.tripId&&!o.polls.some(function(p){return p.id===o.tripId;}))o.tripId=null;
  o.forts=FORTS.map(function(f){return{code:f[0],name:f[1],en:f[2],district:f[3],type:f[4],height:f[5],diff:f[6]};});
  o.fortsV=2;o.fortMig={at:Date.now(),map:mp};
  return true;
}

function csvParse(t){
  var rows=[],r=[],c='',q=false;t=t.replace(/^﻿/,'');
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++;}else q=false;}else c+=ch;}
    else if(ch==='"')q=true;
    else if(ch===','||ch==='\t'){r.push(c);c='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);rows.push(r);r=[];c='';}
    else c+=ch;}
  if(c!==''||r.length){r.push(c);rows.push(r);}
  return rows.filter(function(x){return x.some(function(y){return String(y).trim()!=='';});});
}
function rowsToObjects(rows){
  if(!rows.length)return[];var h=rows[0].map(function(x){return String(x).toLowerCase().replace(/[\s_.]/g,'');});
  return rows.slice(1).map(function(r){var o={};h.forEach(function(k,i){o[k]=r[i]==null?'':String(r[i]).trim();});return o;});
}
function pick(o,keys){for(var i=0;i<keys.length;i++){if(o[keys[i]])return o[keys[i]];}return'';}

/* ===== Firestore helpers: फक्त बदललेल्या fields साठी update() ===== */
var FSC={};  /* path -> शेवटची ज्ञात server copy (onSnapshot/save नंतर भरली जाते) */
function fsClone(o){return JSON.parse(JSON.stringify(o));}
function fsIsObj(v){return v&&typeof v==='object'&&!Array.isArray(v);}
function fsSeen(ref,data){FSC[ref.path]=data?fsClone(data):null;}
function fsForget(ref){delete FSC[ref.path];}
function fsDiff(o,n,path,out){
  var FV=firebase.firestore.FieldValue;
  Object.keys(n).forEach(function(k){
    var p=path.concat(k),a=o?o[k]:undefined,b=n[k];
    if(b===undefined)return;
    if(fsIsObj(a)&&fsIsObj(b)&&Object.keys(b).length)fsDiff(a,b,p,out);
    else if(JSON.stringify(a)!==JSON.stringify(b))out.push([p,b]);
  });
  if(o)Object.keys(o).forEach(function(k){if(!(k in n))out.push([path.concat(k),FV.delete()]);});
  return out;
}
function fsSave(ref,obj){
  var data=fsClone(obj),prev=FSC[ref.path];
  if(!prev)return ref.set(data).then(function(){fsSeen(ref,data);});      /* नवीन document */
  var ch=fsDiff(prev,data,[],[]);
  if(!ch.length)return Promise.resolve();                                /* काहीच बदलले नाही */
  var args=[];
  ch.forEach(function(c){args.push(fsPath(c[0]),c[1]);});
  return ref.update.apply(ref,args).then(function(){fsSeen(ref,data);}).catch(function(e){
    if(e&&e.code==='not-found')return ref.set(data).then(function(){fsSeen(ref,data);});
    throw e;});
}
function fsPath(a){var FP=firebase.firestore.FieldPath;return new (Function.prototype.bind.apply(FP,[null].concat(a)))();}
/* सर्व listeners एकाच ठिकाणी, म्हणजे गरज पडल्यास unsubscribe करता येतात */
var UNSUBS=[];
function listen(ref,onOk,onErr){
  var u=ref.onSnapshot(onOk,function(err){try{console.warn('onSnapshot error:',ref.path||'',err&&err.code);}catch(x){}if(onErr)onErr(err);});
  UNSUBS.push(u);return u;
}
function stopListeners(){UNSUBS.splice(0).forEach(function(u){try{u();}catch(e){}});}

function compress(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var q=.65,u=c.toDataURL('image/jpeg',q);while(u.length>180000&&q>.3){q-=.1;u=c.toDataURL('image/jpeg',q);}cb(u);};im.onerror=function(){cb('');};im.src=fr.result;};fr.readAsDataURL(file);}

/* हिशोब: हिस्सा = बिलांची रक्कम / हिस्सेदार; द्यायचे = हिस्सा − स्वतः केलेला खर्च; बाकी = द्यायचे − मंजूर पेमेंट */
function calc(t){
  var parts=t.parts||[],res={},total=0;
  function ens(m){if(!res[m])res[m]={share:0,spent:0,paid:0,wait:0};return res[m];}
  parts.forEach(ens);
  COL.bills.filter(function(b){return b.tid===t.id;}).forEach(function(b){
    total+=b.amount;ens(b.by).spent+=b.amount;
    var sp=(b.split&&b.split.length)?b.split:parts;
    sp.forEach(function(m){ens(m).share+=b.amount/sp.length;});
  });
  var coll=0;
  COL.pays.filter(function(p){return p.tid===t.id;}).forEach(function(p){
    var r=ens(p.mid);
    if(p.status==='ok'){r.paid+=p.amount;coll+=p.amount;}else if(p.status==='pending')r.wait+=p.amount;
  });
  var leftSum=0,creditSum=0;
  Object.keys(res).forEach(function(m){
    var r=res[m];r.due=r.share-r.spent;r.bal=r.due-r.paid;
    r.left=Math.max(0,Math.round(r.bal*100)/100);r.credit=Math.max(0,Math.round(-r.bal*100)/100);
    leftSum+=r.left;creditSum+=r.credit;
  });
  return{res:res,total:total,coll:coll,leftSum:leftSum,creditSum:creditSum,avg:parts.length?total/parts.length:0};
}
function pendList(){
  if(!canSeeTrips())return[];
  var by={};
  COL.tours.forEach(function(t){
    if(!canSeeTrip(t))return;
    var c=calc(t);if(c.total<=0)return;
    Object.keys(c.res).forEach(function(m){
      var r=c.res[m];
      if(r.left>0.009&&gm(m)){var o=by[m]=by[m]||{mid:m,name:mname(m),amt:0,forts:[]};o.amt+=r.left;o.forts.push(tfort(t).name);}
    });
  });
  return Object.keys(by).map(function(k){return by[k];}).sort(function(a,b){return b.amt-a.amt;});
}

/* ----- trip close (ट्रिप): फक्त ट्रिपची स्थिती बदलते; Visit Entry ला स्पर्श करत नाही ----- */
function closeTour(t){
  t.status=LASTS;t.closedAt=nowIso();t.log=(t.log||[]).concat([{s:LASTS,t:t.closedAt,by:session.u}]);
  colPut('tours',t);save();
}
function approvePay(id){
  var p=COL.pays.find(function(x){return x.id===id;}),t=p&&tour(p.tid);
  if(!p||!t||p.status!=='pending')return;
  if(!canApprove(p,t)){toast('मंजुरीचा अधिकार नाही',true);return;}
  p.appr=p.appr||[];
  if(isAdmin()){p.appr.push({id:'ADMIN',name:'Admin ('+session.u+')',t:nowIso()});p.status='ok';}
  else{
    p.appr.push({id:session.mid,name:mname(session.mid),t:nowIso()});
    if(p.appr.filter(function(a){return a.id!=='ADMIN'&&a.id!=='AUTO';}).length>=2)p.status='ok';
  }
  colPut('pays',p);route();toast(p.status==='ok'?'पेमेंट मंजूर झाले':'तुमची मंजुरी नोंदवली (अजून 1 सदस्य हवा)');
}

/* ----- events for trips ----- */
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');if(!a||a.disabled)return;
  var act=a.dataset.act,id=a.dataset.id,t=null,adm=isAdmin(),me=session.mid;
  switch(act){
    case'myprofile':if(me)memForm(me);break;
    case'avbig':
      var am=gm(id);if(!am)break;
      openModal((am.photo?'<img class="big" src="'+esc(am.photo)+'" alt="">':'<div style="display:flex;justify-content:center">'+avatar(am,'lg').replace('class="av lg"','class="av lg big-av"')+'</div>')+'<h3>'+esc(am.name)+'</h3><div class="row"><button class="btn sm" data-act="close">बंद करा</button></div>',true);break;
    case'photo-rm':tmpPhoto='';var nm=document.querySelector('#sheet [name=name]');$('#phprev').innerHTML=avatar({name:(nm&&nm.value)||'?',photo:''},'lg');break;
    case'goto-trips':location.hash='#trips';break;
    case'pendpop-close':closePendPop();break;
    case'pendpop-go':closePendPop();if(id&&tour(id))tv.id=id;if(location.hash==='#trips')route();else location.hash='#trips';break;
    case'tour-open':tv.id=id;route();window.scrollTo(0,0);break;
    case'tour-back':tv.id=null;route();break;
    case'tour-add':if(adm)tourForm();break;
    case'tour-edit':if(adm)tourForm(id);break;
    case'tour-from-poll':
      if(!adm)break;var pl=P().find(function(p){return p.id===id;});if(!pl)break;
      if(COL.tours.some(function(x){return x.pollId===id;})){toast('या सूचनेची ट्रिप आधीच तयार आहे',true);break;}
      tv.id=newTour(pl.fort,pl.date,pl.days,'',pl.id).id;S.tripId=pl.id;save();closeModal();location.hash='#trips';route();toast('ट्रिप तयार झाली. आता सदस्य सहभागी होऊ शकतात');break;
    case'tour-del':
      if(!adm)break;t=tour(id);if(!t)break;
      confirmModal('ही ट्रिप, तिचे सर्व खर्च व पेमेंट नोंदी हटतील.',function(){COL.bills.filter(function(b){return b.tid===id;}).forEach(function(b){colDel('bills',b.id);});COL.pays.filter(function(p){return p.tid===id;}).forEach(function(p){colDel('pays',p.id);});colDel('tours',id);tv.id=null;closeModal();route();toast('ट्रिप हटवली');});break;
    case'tour-next':
      if(!adm)break;t=tour(id);if(!t||t.status>=LASTS)break;
      if(t.status===LASTS-1){
        confirmModal('ट्रिप पूर्ण करायची? यानंतर खर्च हटवता/बदलता येणार नाहीत.',function(){closeTour(t);closeModal();route();toast('ट्रिप पूर्ण झाली');});
      }else{t.status++;t.log=(t.log||[]).concat([{s:t.status,t:nowIso(),by:session.u}]);colPut('tours',t);route();toast(STAGES[t.status]);}
      break;

/* ---------- MEMBERS ON FIREBASE (प्रत्येक सदस्य = collection 'members' मधील स्वतंत्र document) ---------- */
var MEMD={},MEMJ={},PEND={},MEMREADY=false,MEMSNAP=false,STATEREADY=false;
function sj(o){return JSON.stringify(o,function(k,v){if(v&&typeof v==='object'&&!Array.isArray(v)){var r={};Object.keys(v).sort().forEach(function(x){r[x]=v[x];});return r;}return v;});}
function memPack(m){var u=S.users.find(function(x){return x.mid===m.id;});return JSON.parse(JSON.stringify({id:m.id,m:m,u:u||null}));}
function pushMembers(){
  if(!DB||!MEMREADY)return;
  var ids={};
  S.members.forEach(function(m){ids[m.id]=1;var p=memPack(m),j=sj(p);if(MEMJ[m.id]===j)return;MEMJ[m.id]=j;MEMD[m.id]=p;
    fsSave(DB.collection('members').doc(m.id),p).catch(function(){delete MEMJ[m.id];toast('सदस्य Firebase मध्ये सेव्ह झाला नाही',true);});});
  Object.keys(MEMJ).forEach(function(id){if(!ids[id]){delete MEMJ[id];delete MEMD[id];DB.collection('members').doc(id).delete().catch(function(){});}});
  PEND={};
}
function mergeMembers(){
  Object.keys(MEMD).forEach(function(id){var d=MEMD[id];if(!d||!d.m)return;
    var i=S.members.findIndex(function(x){return x.id===id;});if(i<0)S.members.push(d.m);else S.members[i]=d.m;
    if(!S.visits[id])S.visits[id]={};
    S.users=S.users.filter(function(x){return x.mid!==id;});if(d.u)S.users.push(d.u);
  });
}
function adoptRemote(n){
  var ch=migS(n);
  var pm=S.members.filter(function(m){return PEND[m.id];}),pu=S.users.filter(function(u){return u.mid&&PEND[u.mid];}),pv={};
  pm.forEach(function(m){pv[m.id]=S.visits[m.id];});
  S=n;S.polls=S.polls||[];
  pm.forEach(function(m){if(!S.members.some(function(x){return x.id===m.id;})){S.members.push(m);S.visits[m.id]=pv[m.id]||{};}});
  pu.forEach(function(u){if(!S.users.some(function(x){return x.mid===u.mid;}))S.users.push(u);});
  mergeMembers();
  if(ch){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(x){}pushState();}
  fixAll();
}
function tryMemInit(){
  if(MEMREADY||!STATEREADY||!MEMSNAP)return;
  MEMREADY=true;
  if(!Object.keys(MEMD).length)pushMembers(); /* पहिल्यांदा: आधीचे सदस्य 'members' मध्ये कॉपी */
}
function initMembers(db){
  listen(db.collection('members'),function(q){
    q.docChanges().forEach(function(c){var id=c.doc.id;
      if(c.type==='removed'){fsForget(c.doc.ref);delete MEMD[id];delete MEMJ[id];S.members=S.members.filter(function(x){return x.id!==id;});S.users=S.users.filter(function(x){return x.mid!==id;});delete S.visits[id];}
      else{var d=c.doc.data();fsSeen(c.doc.ref,d);MEMD[id]=d;MEMJ[id]=sj(d);}
    });

    tryMemInit();

}

function fjson(url,opt,ms){
  var c=window.AbortController?new AbortController():null,to=setTimeout(function(){if(c)c.abort();},ms||12000);
  opt=opt||{};if(c)opt.signal=c.signal;

}

    fjson('https://api.ipify.org?format=json',null,3500).then(function(j){VKS.ip=String((j&&j.ip)||'').replace(/[^0-9a-zA-Z]/g,'_');}).catch(function(){}).then(function(){clearTimeout(to);if(!fin){fin=true;res(VKS);}});

var CK='gk-cost',GK='gk-geo',HK='gk-hotels';
var COST={tid:'',fort:'',fq:'',start:'',slat:null,slon:null,slabel:'',fortOv:'',persons:6,days:1,hotel:true,nights:1,perRoom:3,radius:15,petrol:112,car:'sedan',mil:'',stfare:1.8,ttRate:24,busRate:38,food:300,other:0,last:null};
try{var cs=JSON.parse(localStorage.getItem(CK)||'null');if(cs)Object.keys(cs).forEach(function(k){if(k in COST&&k!=='last')COST[k]=cs[k];});}catch(e){}
function saveCost(){try{var o={};Object.keys(COST).forEach(function(k){if(k!=='last')o[k]=COST[k];});localStorage.setItem(CK,JSON.stringify(o));}catch(e){}}
var GEO={};try{GEO=JSON.parse(localStorage.getItem(GK)||'{}')||{};}catch(e){GEO={};}
function saveGeo(){try{localStorage.setItem(GK,JSON.stringify(GEO));}catch(e){}}
var HT=[];try{HT=JSON.parse(localStorage.getItem(HK)||'[]')||[];}catch(e){HT=[];}
function saveHt(){try{localStorage.setItem(HK,JSON.stringify(HT));}catch(e){}}
var CARS={hatch:{name:'Hatchback (4 सीट)',mil:18,seats:4},sedan:{name:'Sedan (4 सीट)',mil:15,seats:4},suv:{name:'SUV / Ertiga (6 सीट)',mil:12,seats:6}};
var lastNom=0;
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function nom(q,bias){
  var wait=Math.max(0,1100-(Date.now()-lastNom));
  return sleep(wait).then(function(){lastNom=Date.now();return fjson('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=4&countrycodes=in&accept-language=en&q='+encodeURIComponent(q)+(bias?'&viewbox=72.4,22.3,81.2,15.4&bounded=1':''),null,12000);});
}
function inMH(r){var la=+r.lat,lo=+r.lon;return la>15.5&&la<22.2&&lo>72.4&&lo<80.95;}
function parseLL(s){var m=/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[, ]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/.exec(s||'');return m?{lat:+m[1],lon:+m[2],label:'GPS '+(+m[1]).toFixed(4)+', '+(+m[2]).toFixed(4)}:null;}
function shortLabel(r,q){return String(r.display_name||q).split(',').slice(0,3).join(',');}
function geoPlace(q,bias,key){
  key=key||('P:'+q.toLowerCase());
  if(GEO[key])return Promise.resolve(GEO[key]);
  var ll=parseLL(q);if(ll)return Promise.resolve(ll);
  return nom(q,bias).then(function(rs){rs=rs||[];if(bias)rs=rs.filter(inMH);var r=rs[0];if(!r)return null;var o={lat:+r.lat,lon:+r.lon,label:shortLabel(r,q)};GEO[key]=o;saveGeo();return o;});
}
function geoFort(f){
  var key='F:'+f.code;if(GEO[key])return Promise.resolve(GEO[key]);
  var base=String(f.name).replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
  var qs=[base+' '+f.district+' महाराष्ट्र'];
  if(f.en){qs.push(f.en+' Fort '+f.district+' Maharashtra');qs.push(f.en+' Fort Maharashtra');}
  var i=0;
  function next(){
    if(i>=qs.length)return Promise.resolve(null);
    var q=qs[i++];
    return nom(q,true).then(function(rs){var r=(rs||[]).filter(inMH)[0];if(r){var o={lat:+r.lat,lon:+r.lon,label:shortLabel(r,q)};GEO[key]=o;saveGeo();return o;}return next();}).catch(function(){return next();});
  }
  return next();
}
function hav(a,b,c,d){var R=6371,x=(c-a)*Math.PI/180,y=(d-b)*Math.PI/180,q=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(q));}
function osrmRoute(a,b){
  return fjson('https://router.project-osrm.org/route/v1/driving/'+a.lon+','+a.lat+';'+b.lon+','+b.lat+'?overview=false',null,15000).then(function(j){
    var r=j&&j.routes&&j.routes[0];if(!r)throw new Error('noroute');return{km:r.distance/1000,hrs:r.duration/3600,approx:false};
  }).catch(function(){var k=hav(a.lat,a.lon,b.lat,b.lon)*1.35;return{km:k,hrs:k/45,approx:true};});
}
var OVP=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
function overpass(lat,lon,rad){
  var q='[out:json][timeout:25];nwr["tourism"~"^(hotel|guest_house|hostel|motel|resort|chalet|apartment|camp_site)$"]["name"](around:'+(rad*1000)+','+lat+','+lon+');out center tags 150;';
  var i=0;
  function tr(){
    if(i>=OVP.length)return Promise.resolve(null);
    return fjson(OVP[i++],{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'data='+encodeURIComponent(q)},28000).then(function(j){return (j&&j.elements)||[];}).catch(function(){return tr();});
  }
  return tr();
}
/* OpenStreetMap वर hotel चे दर नसतात; प्रकार/star वरून अंदाजे दर (₹ प्रति रूम प्रति रात्र; hostel/camp = प्रति बेड) */
function hotelEst(tg){
  var t=tg.tourism,st=parseFloat(tg.stars)||0;
  if(t==='hostel')return{kind:'Hostel',unit:'bed',lo:400,hi:900};
  if(t==='camp_site')return{kind:'Camping',unit:'bed',lo:300,hi:800};
  if(t==='guest_house')return{kind:'Guest house / लॉज',unit:'room',lo:1000,hi:2200};
  if(t==='motel')return{kind:'Motel',unit:'room',lo:1500,hi:2800};
  if(t==='resort')return{kind:'Resort',unit:'room',lo:3500,hi:9000};
  if(t==='chalet'||t==='apartment')return{kind:'Homestay / Villa',unit:'room',lo:2500,hi:5500};
  if(st>=5)return{kind:'Hotel 5★',unit:'room',lo:9000,hi:16000};
  if(st>=4)return{kind:'Hotel 4★',unit:'room',lo:5000,hi:9500};
  if(st>=3)return{kind:'Hotel 3★',unit:'room',lo:2800,hi:5000};
  if(st>=2)return{kind:'Hotel 2★',unit:'room',lo:1800,hi:3000};
  if(st>=1)return{kind:'Hotel 1★',unit:'room',lo:1000,hi:2000};
  return{kind:'Hotel',unit:'room',lo:1500,hi:3500};
}
function roadDists(fp,list){
  if(!list.length)return Promise.resolve(list);
  var co=fp.lon+','+fp.lat+';'+list.map(function(h){return h.lon+','+h.lat;}).join(';');
  return fjson('https://router.project-osrm.org/table/v1/driving/'+co+'?sources=0&annotations=distance',null,15000).then(function(j){
    var d=j&&j.distances&&j.distances[0];if(!d)return list;
    list.forEach(function(h,i){var v=d[i+1];if(v!=null){h.km=v/1000;h.road=true;}});return list;
  }).catch(function(){return list;});
}
function findHotels(fp,rad){
  return overpass(fp.lat,fp.lon,rad).then(function(els){
    if(els===null)return{list:[],rad:rad,err:true};
    if(els.length<4&&rad<40){var r2=Math.min(40,rad*2);return overpass(fp.lat,fp.lon,r2).then(function(e2){return{list:e2||els,rad:r2};});}
    return{list:els,rad:rad};
  }).then(function(o){
    var seen={},list=[];
    o.list.forEach(function(el){
      var tg=el.tags||{},la=el.lat!=null?el.lat:(el.center&&el.center.lat),lo=el.lon!=null?el.lon:(el.center&&el.center.lon);
      if(!tg.name||la==null)return;
      var k=tg.name.toLowerCase();if(seen[k])return;seen[k]=1;
      var e=hotelEst(tg);
      list.push({name:tg.name,lat:la,lon:lo,km:hav(fp.lat,fp.lon,la,lo)*1.3,road:false,kind:e.kind,unit:e.unit,lo:e.lo,hi:e.hi,est:true,stars:parseFloat(tg.stars)||0,rating:'',phone:tg.phone||tg['contact:phone']||''});
    });
    list.sort(function(a,b){return a.km-b.km;});list=list.slice(0,15);
    return roadDists(fp,list).then(function(l){l.sort(function(a,b){return a.km-b.km;});return{list:l,rad:o.rad,err:o.err};});
  });
}

/* ----- calculation ----- */
function hotelTotal(h,price,P){var u=h.unit==='bed'?P.persons:Math.ceil(P.persons/P.perRoom);return u*P.nights*price;}
function manualHotels(code){
  return HT.filter(function(h){return h.fort===code;}).map(function(h){return{id:h.id,add:h.add,name:h.name,km:+h.km||0,kind:'सदस्याने नोंदवलेले',unit:'room',lo:+h.price,hi:+h.price,est:false,stars:0,rating:h.rating,phone:h.phone||'',manual:true,road:true};});
}
function allHotels(o,code){
  var man=manualHotels(code),names={};man.forEach(function(h){names[h.name.toLowerCase()]=1;});
  var osm=((o.h&&o.h.list)||[]).filter(function(h){return !names[h.name.toLowerCase()];});
  return man.concat(osm).sort(function(a,b){return a.km-b.km;});
}
function transportOptions(km,P){
  var car=CARS[P.car]||CARS.sedan,mil=parseFloat(P.mil)>0?parseFloat(P.mil):car.mil,cars=Math.ceil(P.persons/car.seats),bikes=Math.ceil(P.persons/2),days=P.days,o=[];
  var cl=cars*km/mil;
  o.push({icon:'🚗',name:'कार — '+car.name,detail:cars+' गाडी · '+mil+' km/L · पेट्रोल '+(Math.round(cl*10)/10)+' L × ₹'+P.petrol,total:cl*P.petrol});
  var bl=bikes*km/40;
  o.push({icon:'🏍️',name:'बाईक',detail:bikes+' बाईक (प्रत्येकी 2 जण) · 40 km/L · पेट्रोल '+(Math.round(bl*10)/10)+' L',total:bl*P.petrol});
  o.push({icon:'🚌',name:'ST / सार्वजनिक बस',detail:'₹'+P.stfare+'/km प्रति व्यक्ती × '+P.persons+' जण (पायथ्यापर्यंत स्थानिक वाहन "इतर खर्च" मध्ये)',total:P.persons*km*P.stfare});
  var tv=Math.ceil(P.persons/12),tk=Math.max(km,250*days);
  o.push({icon:'🚐',name:'Tempo Traveller (भाड्याने)',detail:tv+' गाडी · ₹'+P.ttRate+'/km · किमान 250 km/दिवस + ड्रायव्हर बत्ता ₹500/दिवस',total:tv*(tk*P.ttRate+500*days)});
  var bv=Math.ceil(P.persons/35),bk=Math.max(km,300*days);
  o.push({icon:'🚍',name:'खाजगी बस (भाड्याने)',detail:bv+' बस · ₹'+P.busRate+'/km · किमान 300 km/दिवस + ड्रायव्हर बत्ता ₹700/दिवस',total:bv*(bk*P.busRate+700*days)});
  return o;
}
function mapsDir(a,b){return 'https://www.google.com/maps/dir/?api=1&origin='+a.lat+','+a.lon+'&destination='+b.lat+','+b.lon;}
function hotelLink(h){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(h.name+(h.lat!=null?' '+h.lat+','+h.lon:''));}
function r0(n){return Math.round(n);}

function runCost(){
  var P=readCost(),f=fortMap()[P.fort];
  if(!f){toast('किल्ला निवडा',true);return;}
  if(!P.start){toast('सुरुवातीचे ठिकाण लिहा',true);return;}
  if(!canUseCost(P.fort)){showGate(P.fort);return;}
  var seq=++RUNSEQ,out={};
  function step(m){if(seq===RUNSEQ&&$('#cres'))$('#cres').innerHTML='<div class="panel empty">⏳ '+esc(m)+'</div>';}
  function fail(m){if(seq===RUNSEQ&&$('#cres'))$('#cres').innerHTML='<div class="panel empty">⚠️ '+m+'</div>';}
  step('सुरुवातीचे ठिकाण शोधत आहे…');
  var sp=(COST.slat!=null&&P.start===COST.slabel)?Promise.resolve({lat:COST.slat,lon:COST.slon,label:COST.slabel}):geoPlace(P.start,false);
  sp.then(function(s){
    if(!s)throw new Error('start');
    out.s=s;step('किल्ल्याचे ठिकाण शोधत आहे…');
    return P.fortOv?geoPlace(P.fortOv,true,'O:'+f.code+':'+P.fortOv.toLowerCase()):geoFort(f);
  }).then(function(fp){
    if(!fp)throw new Error('fort');
    out.f=fp;step('मार्ग व अंतर काढत आहे…');return osrmRoute(out.s,fp);
  }).then(function(r){
    out.r=r;if(!P.hotel)return null;
    step('जवळची हॉटेल्स शोधत आहे…');return findHotels(out.f,P.radius);
  }).then(function(h){
    if(seq!==RUNSEQ)return;
    out.h=h||{list:[]};COST.last={o:out,P:JSON.parse(JSON.stringify(P))};
    if($('#cres'))renderCost(out,P);
  }).catch(function(e){
    var m=String(e&&e.message);
    if(m==='start')fail('सुरुवातीचे ठिकाण सापडले नाही. जवळचे मोठे गाव/शहर लिहा (उदा. "पुणे") किंवा 📍 वापरा.');
    else if(m==='fort')fail('"'+esc(f.name)+'" चे ठिकाण नकाशावर सापडले नाही. वरील "किल्ल्याचे ठिकाण" मध्ये जवळचे गाव (उदा. "वेल्हे, पुणे") किंवा lat,lon लिहा.');
    else fail('इंटरनेट/नकाशा सेवा उपलब्ध नाही. थोड्या वेळाने पुन्हा प्रयत्न करा.');
  });
}

/* =====================================================================
   खर्च अंदाज — पेमेंट gate (प्रत्येक किल्ल्यासाठी वेगळे पेमेंट, कोणीही — Login लागत नाही)
   Admin रक्कम + QR ठरवतो → user पेमेंट करून screenshot देतो → Admin कन्फर्म करतो
   → तो किल्ला त्या device/सदस्याला ठरलेले तास (डिफॉल्ट 24) पाहता येतो.

var CS={on:false,fee:0,hours:24,qr:'',note:''},CA=[],tmpQr='',tmpShot='',gateSig='';
try{var cs0=JSON.parse(localStorage.getItem('gk-cs')||'null');if(cs0)CS=Object.assign(CS,cs0);}catch(e){}
try{CA=JSON.parse(localStorage.getItem('gk-ca')||'[]')||[];}catch(e){CA=[];}
function saveCs(){try{localStorage.setItem('gk-cs',JSON.stringify(CS));}catch(e){toast('जागा संपली, QR जतन झाला नाही',true);}}
function saveCa(){try{localStorage.setItem('gk-ca',JSON.stringify(CA));}catch(e){}}
function payOn(){return !!CS.on&&CS.fee>0;}
function hoursOf(){return CS.hours>0?CS.hours:24;}
function isMine(a){return (!!a.dv&&a.dv===VKS.dv)||(!!session.mid&&a.mid===session.mid);}
function fortName(code){var f=fortMap()[code];return f?f.name:'—';}
function passFor(code){var n=Date.now();return CA.find(function(a){return a.fort===code&&a.status==='ok'&&a.exp>n&&isMine(a);});}
function lastReq(code){return CA.filter(function(a){return a.fort===code&&isMine(a);}).sort(function(a,b){return a.t<b.t?1:-1;})[0];}
function canUseCost(code){return isAdmin()||!payOn()||!!(code&&passFor(code));}
function costPendN(){return CA.filter(function(x){return x.status==='pending';}).length;}
function gateSigNow(){var l=lastReq(COST.fort);return [payOn(),CS.fee,CS.hours,(CS.qr||'').length,CS.note,COST.fort,canUseCost(COST.fort),l?l.status:''].join('|');}
function caPut(o){
  var i=CA.findIndex(function(x){return x.id===o.id;});if(i<0)CA.push(o);else CA[i]=o;
  if(DB)return fsSave(DB.collection('costaccess').doc(o.id),o).catch(function(){toast('सेव्ह झाले नाही (Firestore Rules तपासा)',true);});
  saveCa();return Promise.resolve();
}

document.addEventListener('click',function(e){

  var act=a.dataset.act,id=a.dataset.id;
  switch(act){
    case'photo-share':e.preventDefault();sharePhoto(id);break;
    case'photo-cmt':e.preventDefault();showPhoto(id);setTimeout(function(){var x=document.querySelector('#sheet [name=tx]');if(x)x.focus();},60);break;
    case'cmt-del':
      var pid=a.dataset.p;CM=CM.filter(function(c){return c.id!==id;});
      if(DB)DB.collection('pcomments').doc(id).delete().catch(function(){toast('कमेंट हटवता आली नाही',true);});else saveCm();
      drawCmts(pid);break;
    case'copylink':var u=$('#shu');if(u){u.select();try{navigator.clipboard.writeText(u.value).then(function(){toast('लिंक कॉपी झाली');},function(){toast('Ctrl+C दाबा');});}catch(x){toast('Ctrl+C दाबा');}}break;
    case'site-like':toggleSiteLike();break;
    case'ca-save':
      if(!isAdmin())break;
      var nf=Math.max(0,parseFloat(cv('ca_fee'))||0),non=cv('ca_on')==='1',nh=parseFloat(cv('ca_hrs'));
      CS={on:non,fee:nf,hours:nh>0?nh:24,note:cv('ca_note').trim(),qr:tmpQr||CS.qr||''};tmpQr='';
      if(DB)fsSave(DB.doc('settings/cost'),CS).catch(function(){toast('सेव्ह झाले नाही (Firestore Rules तपासा)',true);});else saveCs();
      toast(non&&!nf?'पेमेंट चालू करण्यासाठी रक्कम टाका':'जतन झाले',non&&!nf);refreshCaAdmin();break;
    case'ca-ok':case'ca-rej':
      if(!isAdmin())break;
      var ca=CA.find(function(x){return x.id===id;});if(!ca)break;
      ca.status=act==='ca-ok'?'ok':'rejected';ca.appr={by:session.u,t:nowIso()};
      if(act==='ca-ok')ca.exp=Date.now()+hoursOf()*3600000;
      caPut(ca);refreshCaAdmin();drawChrome();
      toast(act==='ca-ok'?'परवानगी दिली ('+hoursOf()+' तास)':'नाकारले');break;
    case'ca-revoke':
      if(!isAdmin())break;
      CA=CA.filter(function(x){return x.id!==id;});
      if(DB)DB.collection('costaccess').doc(id).delete().catch(function(){toast('हटवता आले नाही',true);});else saveCa();
      refreshCaAdmin();drawChrome();break;
    case'ca-shot':
      var cs1=CA.find(function(x){return x.id===id;});if(!cs1||!cs1.photo)break;
      openModal('<img class="big" src="'+esc(cs1.photo)+'" alt=""><h3 style="margin-top:10px">'+esc(mname(cs1.mid))+' · '+rs(cs1.amount||0)+'</h3><p class="muted small">'+(cs1.utr?'UTR: '+esc(cs1.utr)+' · ':'')+fmtDT(cs1.t)+'</p><div class="row"><button class="btn sm" data-act="close">बंद करा</button></div>',true);break;
    case'cost-run':runCost();break;
    case'cost-gps':useGps();break;
    case'cost-share':shareCost();break;
    case'hotel-add':hotelForm();break;
    case'hotel-del':
      var h=HT.find(function(x){return x.id===id;});if(!h)break;
      if(!(isAdmin()||(!!session.mid&&h.add===session.mid)))break;
      HT=HT.filter(function(x){return x.id!==id;});
      if(DB)DB.collection('hotels').doc(id).delete().catch(function(){toast('हटवता आले नाही',true);});else saveHt();
      if(COST.last&&$('#cres'))renderCost(COST.last.o,COST.last.P);break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='ca_qr'||t.id==='ca_shot'){
    var isQ=t.id==='ca_qr';
    if(t.files[0])compress(t.files[0],function(u){if(isQ)tmpQr=u;else tmpShot=u;var pv=$(isQ?'#ca_qrprev':'#ca_shotprev');if(pv)pv.innerHTML=u?'<img src="'+u+'" alt="" style="width:120px;height:120px;background:#fff">':'';});

  if(t.id==='c_trip'){readCost();prefillTrip(t.value);return;}

document.addEventListener('submit',function(e){
  var fm=e.target.dataset&&e.target.dataset.form;if(fm!=='cmt'&&fm!=='hotel'&&fm!=='caform')return;
  e.preventDefault();
  var form=e.target,d=new FormData(form),g=function(k){return String(d.get(k)||'').trim();};
  if(fm==='cmt'){
    var pid=form.dataset.pid,nm=g('nm').slice(0,30),tx=g('tx').slice(0,300);
    if(!nm||!tx)return;
    if(Date.now()-lastCm<4000){toast('थोडं थांबा, मग पुन्हा कमेंट करा',true);return;}
    lastCm=Date.now();try{localStorage.setItem('gk-cmn',nm);}catch(x){}
    vkReady().then(function(){
      var c={id:'C'+Date.now()+Math.random().toString(36).slice(2,6),pid:pid,name:nm,text:tx,t:nowIso(),mid:session.mid||'',vk:vkEntry()};

    if(!tmpShot){toast('पेमेंट screenshot निवडा',true);return;}

      caPut({id:'R'+Date.now()+Math.random().toString(36).slice(2,6),fort:code,dv:VKS.dv,ip:VKS.ip,mid:session.mid||'',name:cnm,phone:cph,status:'pending',amount:CS.fee,utr:g('utr'),photo:tmpShot,t:nowIso()});

    });
    return;
  }
  if(!(isAdmin()||session.mid))return;
  var price=parseFloat(g('pr')),km=parseFloat(g('km')),rt=g('rt');
  if(!g('nm')||!(price>0)||!(km>=0)){toast('माहिती नीट भरा',true);return;}
  var hh={id:'H'+Date.now(),fort:form.dataset.fort,name:g('nm'),price:price,km:km,rating:rt===''?'':Math.min(5,Math.max(0,parseFloat(rt)||0)),phone:g('ph'),add:session.mid||'ADMIN',t:nowIso()};
  HT.push(hh);
  if(DB)fsSave(DB.collection('hotels').doc(hh.id),hh).catch(function(){toast('हॉटेल सेव्ह झाले नाही (Firestore Rules तपासा)',true);});else saveHt();
  closeModal();toast('हॉटेल जोडले');
  if(COST.last&&$('#cres'))renderCost(COST.last.o,COST.last.P);
});

/* जुन्या भेटी-फोटो / ट्रिप नोंदींचे किल्ला कोड नव्या कोडवर (एकदाच, fm=1 खूण) */
function fixAll(){
  var M=S.fortMig&&S.fortMig.map;if(!M)return;
  var at=S.fortMig.at,vch=false;
  function chk(r){if(r.fm||!r.fort)return false;var ts=+((/(\d{12,})/.exec(r.id||'')||[])[1])||0;if(ts>=at)return false;r.fort=M[r.fort]||'';r.fm=1;return true;}
  VR.forEach(function(r){if(chk(r)){vch=true;if(DB)fsSave(DB.collection('trips').doc(r.id),r).catch(function(){});}});
  if(vch&&!DB)saveLocalVisits();
  COL.tours.slice().forEach(function(r){if(chk(r))colPut('tours',r);});
}
function setSync(msg){var el=$('#syncst');if(el)el.textContent=msg;}
var SYNCSTARTED=false;
function initSync(db){
  if(SYNCSTARTED)return;SYNCSTARTED=true;
  DB=db;FBDECIDED=true;initViews(db);initMembers(db);initExtra(db);
  listen(db.doc('state/main'),function(sn){
    setSync(' · ☁️ Firebase लाईव्ह');
    if(sn.exists){fsSeen(sn.ref,sn.data());
      var j=(sn.data()||{}).json;
      if(j&&j!==lastJ){
        try{var n=JSON.parse(j);
          if(n&&n.forts&&n.members&&n.visits&&n.users){lastJ=j;adoptRemote(n);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(x){}rerenderMaybe(['home','forts','members','visits','map','reports','trips','gallery']);}
        }catch(x){}
      }
    }else pushState();
    STATEREADY=true;tryMemInit();maybePendPop();
  },function(err){setSync(' · ⚠️ Firebase त्रुटी: '+((err&&(err.code||err.message))||'')+' (Firestore Rules तपासा)');});
  listen(db.collection('presence'),function(q){PRES={};q.docs.forEach(function(d){fsSeen(d.ref,d.data());PRES[d.id]=(d.data()||{}).t||0;});rerenderMaybe(['members']);});
  listen(db.collection('trips'),function(q){q.docs.forEach(function(d){fsSeen(d.ref,d.data());});VR=q.docs.map(function(d){return d.data();});fixAll();rerenderMaybe(['gallery','visits']);});
  ['tours','bills','pays'].forEach(function(k){
    listen(db.collection(k),function(q){q.docs.forEach(function(d){fsSeen(d.ref,d.data());});COL[k]=q.docs.map(function(d){return d.data();});if(k==='tours'){COL.tours.forEach(normTour);fixAll();}COLRDY[k]=true;rerenderMaybe(['trips','home']);maybePendPop();},function(){COLRDY[k]=true;maybePendPop();});
  });
}
if(window.GK_DB)initSync(window.GK_DB);
else{

}

fixAll();
route();

    document.head.appendChild(s);});}
  async function loadLib(name,ok){
    for(var i=0;i<BASES.length&&!ok();i++){try{await load(BASES[i](name));}catch(e){console.warn(e.message);}}
    return ok();
  }
  var hasApp=function(){return !!(window.firebase&&firebase.initializeApp);};
  var hasFs=function(){return !!(window.firebase&&firebase.firestore);};
  try{
    if(!(await loadLib('app',hasApp)))throw new Error('Firebase app SDK लोड झाले नाही (इंटरनेट/ब्लॉक)');
    if(!(await loadLib('firestore',hasFs)))throw new Error('Firestore SDK लोड झाले नाही (इंटरनेट/ब्लॉक)');
    /* 1) कोणतीही operation करण्यापूर्वी terminate() */
    firebase.initializeApp(firebaseConfig);
    var tmp=firebase.firestore();
    try{
      await tmp.terminate();
      /* 2) terminate नंतर जुना IndexedDB cache पुसणे */
      await tmp.clearPersistence();
    }catch(e){console.warn('terminate/clearPersistence:',e&&e.code||e);}
    /* terminate झालेली instance पुन्हा वापरता येत नाही, म्हणून app नव्याने तयार करतो */
    await firebase.app().delete();
    firebase.initializeApp(firebaseConfig);
    window.GK_DB=firebase.firestore();
    window.dispatchEvent(new Event('gk-db'));
    /* Analytics ऐच्छिक: न चालले तरी app चालेल */
    try{ if(await loadLib('analytics',function(){return !!(firebase.analytics);}))firebase.analytics(); }catch(e){}
  }catch(e){
    console.error(e);
    window.dispatchEvent(new Event('gk-db-fail'));
  }
})();
</script>

</body></html>
